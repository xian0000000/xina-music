<!-- chat: kolom ketik muncul sebentar di bawah, pesan tampil sebagai gelembung di atas kepala lalu hilang -->
<form class="chatbar" id="chatbar" autocomplete="off">
  <input id="chatIn" type="text" maxlength="80" placeholder="Ketik pesan…" enterkeyhint="send" aria-label="Pesan chat">
</form>

<!-- catetan: teks singkat di bawah avatarmu, tetap tampil sampai kamu menyimpan yang baru -->
<div class="notemenu" id="installMenu" role="dialog" aria-label="Install aplikasi" hidden>
  <div class="sm-l" style="margin-bottom:8px">Install Xina Music</div>
  <div class="sm-hint" id="installHelp" style="margin:0 0 12px"></div>
  <div class="sm-act"><button type="button" class="sm-save" id="installGo">Install</button></div>
</div>

<form class="notemenu" id="nameMenu" role="dialog" aria-label="Ganti nama" autocomplete="off" hidden>
  <label class="sm-l" for="nameIn">Nama kamu</label>
  <input id="nameIn" type="text" maxlength="24" placeholder="Nama" enterkeyhint="done">
  <div class="sm-act"><button type="submit" class="sm-save">Simpan</button></div>
</form>

<form class="notemenu" id="noteMenu" role="dialog" aria-label="Catetan" autocomplete="off" hidden>
  <label class="sm-l" for="noteIn">Catetan <small id="noteCount">0/40</small></label>
  <input id="noteIn" type="text" maxlength="40" placeholder="mis. lagi ngerjain tugas" enterkeyhint="done">
  <div class="sm-hint">Tampil di atas avatarmu untuk semua orang dan tidak hilang sampai kamu menyimpan catetan baru.</div>
  <div class="sm-act">
    <button type="button" class="sm-clear" id="noteClear">Hapus</button>
    <button type="submit" class="sm-save">Simpan</button>
  </div>
</form>

<div class="songpanel" id="songPanel" role="dialog" aria-modal="true" aria-label="Daftar lagu" hidden>
  <div class="sp-back" id="spBack"></div>
  <div class="sp-card">
    <div class="sp-head">
      <div class="sp-title"><b>Daftar lagu</b><small id="spInfo"></small></div>
      <button type="button" class="sp-x" id="spClose" aria-label="Tutup"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ul class="sp-list" id="spList"></ul>
    <div class="sp-empty" id="spEmpty" hidden>Belum ada lagu. Tambah lagu pertamamu.</div>
    <div class="sm-act"><button type="button" class="sm-save" id="spAdd">+ Tambah lagu</button></div>
    <div class="sm-hint" id="spHint"></div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>
<div class="drop" id="drop"><span>Lepas file lagu di sini</span></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
