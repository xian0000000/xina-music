name: Deploy xina music

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buat config.js dari secret
        env:
          FIREBASE_CONFIGS: ${{ secrets.FIREBASE_CONFIGS }}
          YT_WORKER: ${{ secrets.YT_WORKER || vars.YT_WORKER }}
        run: |
          test -n "$FIREBASE_CONFIGS" || { echo "Secret FIREBASE_CONFIGS belum diisi"; exit 1; }
          printf 'window.FIREBASE_CONFIGS = %s;\n' "$FIREBASE_CONFIGS" > config.js
          printf 'window.YT_WORKER = "%s";\n' "${YT_WORKER//\"/}" >> config.js

      - name: Siapkan folder publik
        run: |
          mkdir _site
          cp index.html app.js style.css lame.min.js config.js manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          cp tick.wav _site/ 2>/dev/null || true

      - name: Publish ke branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
